# XcodeGen spec. The .xcodeproj is generated by ./build.sh and never committed.
# Values come from docs/design-spec.md (Doc B) sections 1 and 7.
name: QuickEdit
options:
  bundleIdPrefix: dev.yili
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"            # Swift 6 language mode
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: "1.0.1"      # About box credit without TextEdit
    CURRENT_PROJECT_VERSION: "1"    # build.sh passes the commit count
    DEVELOPMENT_TEAM: 8Q5V8XK85Y
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"         # build.sh picks Developer ID when the keychain is open
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES

targets:
  QuickEdit:
    type: application
    platform: macOS
    sources:
      - path: QuickEdit
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.QuickEdit
        PRODUCT_NAME: QuickEdit
        INFOPLIST_FILE: QuickEdit/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: QuickEdit/Resources/QuickEdit.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The Icon Composer file QuickEdit/Resources/QuickEdit.icon (M10 n1).
        # actool compiles it into Assets.car, so macOS 26+ draws it full size
        # with no gray plate (the Kelpi pattern).
        ASSETCATALOG_COMPILER_APPICON_NAME: QuickEdit
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
      configs:
        # The tests run the Debug app sandboxed. Its own bundle ID gives it its
        # own container and settings, so test runs never touch the user's
        # real ~/Library/Containers/dev.yili.QuickEdit or its settings.
        # container-migration.plist names the user's real settings file, so
        # the Debug app must never carry it: its first launch would move that
        # file into the Debug container. The script below fails the build if
        # it slips in anyway.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.yili.QuickEdit.debug
          EXCLUDED_SOURCE_FILE_NAMES: container-migration.plist
    postBuildScripts:
      - name: Debug app has no container-migration.plist
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Release" ] && [ -e "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/container-migration.plist" ]; then
            echo "error: the $CONFIGURATION app must not carry container-migration.plist (it would move the user's real settings)"
            exit 1
          fi

  QuickEditTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QuickEditTests
    dependencies:
      - target: QuickEdit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.QuickEditTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuickEdit.app/Contents/MacOS/QuickEdit"
        BUNDLE_LOADER: "$(TEST_HOST)"

  QuickEditUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: QuickEditUITests
    dependencies:
      - target: QuickEdit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yili.QuickEditUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuickEdit

schemes:
  QuickEdit:
    build:
      targets:
        QuickEdit: all
        QuickEditTests: [test]
        QuickEditUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: QuickEditTests
        - name: QuickEditUITests
    archive:
      config: Release
